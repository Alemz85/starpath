# Career-Ops Portal Scanner Configuration
#
# Copy this file to user/portals.yml and customize for your target roles.
# The scanner (`scripts/scan.mjs`) reads this to:
#   - Hit each tracked company's ATS API directly (Greenhouse / Ashby /
#     Lever / SmartRecruiters / Workday) — zero Claude tokens.
#   - Filter results by title using the positive / negative keyword lists.
#   - Filter out non-target-language postings via lang_blocklist.
#
# After you fill in the basics (positive / negative / a few companies),
# the onboarding wizard's Re-tailor step can refine the filters using
# Claude — it reads your CV + profile.yml and generates better keyword
# lists. You can also re-run that any time from the Configuration tab
# in the desktop app.

# ─── Title filter ────────────────────────────────────────────────────────────
# At least 1 positive must match AND 0 negatives must match (case-insensitive).
#
# Matching is WORD-AWARE: a keyword like "Lead" matches the standalone word
# "Lead" anywhere in the title ("Operations Lead", "Lead, Strategy") but never
# inside another word ("Leadership", "Leading"). You do NOT need the old
# trailing-space trick ("Lead ", "Senior ") — bare words ("Lead", "Senior")
# are correct and safe. Trailing/leading spaces are trimmed before matching.
# Multi-word phrases ("Strategy & Operations", "Head of") match as a whole.

search_templates:
  roles_default: '"Analyst" OR "Operations" OR "Strategy" OR "Graduate" OR "Intern" OR "Working Student"'
  roles_tech_sales: '"Solutions Consultant" OR "Customer Engineer" OR "Sales Engineer" OR "Pre-Sales" OR "Tech Sales" OR "Sales"'
  roles_analytics: '"Business Analyst" OR "Data Analyst" OR "Analytics"'
  roles_consulting: '"Technology Consulting" OR "Digital Transformation" OR "Consulting"'
  loc_europe: 'Europe OR London OR Amsterdam OR Dublin OR Barcelona OR Madrid'
  loc_uk_ire: 'Dublin OR London'
  loc_dach_nordics: 'Copenhagen OR Berlin OR Munich OR Amsterdam'

title_filter:
  # Job titles that indicate a match. Derive these from the archetypes
  # in your profile.yml — common variations and abbreviations included.
  positive:
    - "Strategy"
    - "Operations"
    - "Strategy & Operations"
    - "Business Analyst"
    - "Data Analyst"
    - "Analytics"
    - "Business Intelligence"
    - "BI Analyst"
    - "Insights Analyst"
    - "Solutions Consultant"
    - "Solutions Engineer"
    - "Customer Engineer"
    - "Account Strategist"
    - "Marketing Analytics"
    - "Marketing Operations"
    - "Growth Analytics"
    - "Performance Marketing"
    - "Graduate"
    - "Graduate Program"
    - "Rotational"
    - "Early Career"
    - "Trainee"
    - "Associate"
    - "Intern"
    - "Internship"
    - "Junior"

  # Filter out false positives — postings that match a positive keyword
  # but are clearly wrong for your level / domain.
  negative:
    # Wrong seniority (drop these if you ARE targeting senior roles)
    - "Senior "
    - "Sr "
    - "Sr."
    - "Principal"
    - "Staff "
    - "Lead "
    - "Head of"
    - "Director"
    - "VP"
    - "Chief"
    # Wrong technical function — drop if you ARE targeting engineering
    - "Software Engineer"
    - "Backend Engineer"
    - "Frontend Engineer"
    - "Full Stack"
    - "DevOps"
    - "SRE"
    - "iOS"
    - "Android"
    # Domain mismatch — adjust to your target domains
    - "Tax "
    - "Audit"
    - "Payroll"
    - "Accounting"
    - "AML"
    - "Clinical"
    - "Real Estate"
    - "Graphic Designer"
    - "UX Designer"
    - "Copywriter"
    # Big-4-style consulting noise — drop these if you ARE targeting M&A
    - "M&A"
    - "Due Diligence"
    - "Transfer Pricing"
    - "Forensic"

  # Boost signal — these presence in a title is a strong positive even
  # alongside other keywords. Used by the eval to prioritize entry-level
  # variants of titles you target.
  seniority_boost:
    - "Junior"
    - "Associate"
    - "Entry Level"
    - "Analyst"
    - "Intern"

# ─── Language barrier filter ─────────────────────────────────────────────────
# Postings whose title contains any of these tokens are rejected as
# non-target-language. Tokens match case-insensitively. Add only
# high-confidence markers (avoid false positives against English).
#
# Default list below covers Spanish, Dutch, German, French — uncomment
# the languages you DON'T speak fluently. The setup wizard can auto-fill
# this based on your profile.yml `languages` field.

lang_blocklist: []
  # # Spanish (uncomment if you don't speak Spanish)
  # - "consultoría"
  # - "becas"
  # - "septiembre"
  # # Dutch (uncomment if you don't speak Dutch)
  # - "werkstudent"
  # - "fiscaal"
  # - "meeloopstage"
  # # German (uncomment if you don't speak German)
  # - "mitarbeiter"
  # - "(w/m/d)"
  # - "(m/w/d)"
  # - "Deutschkenntnisse"
  # # French (uncomment if you don't speak French)
  # - "Stagiaire"
  # - "Alternance"
  # - "Développeur"
  # - "Ingénieur"

# ─── Location allowlist (optional) ───────────────────────────────────────────
# A posting passes the location gate if its location matches ANY token here
# (word-aware, case-insensitive) OR if the ATS returns no location at all
# (location is a SOFT filter — unknown locations are kept, not dropped).
#
# Leave this out to use the built-in generic EU/UK hub list (Spain, Ireland,
# Netherlands, UK, Germany, France, the Nordics, "remote", …). Set it to
# narrow to your own target geographies, e.g.:
#
# location_allowlist:
#   - "remote"
#   - "City, Country"     # add your preferred cities / countries
#   - "Another City"

# ─── Search queries ──────────────────────────────────────────────────────────
# Board-wide searches for discovery across ALL companies on each platform.
# These are used by /career-ops scan when no specific company is targeted.

search_queries:
  - name: Greenhouse — Strategy & Operations
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io {{roles_default}}'
    enabled: true

  - name: Greenhouse — Business / Data Analyst
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io {{roles_analytics}}'
    enabled: true

  - name: Ashby — Analytics
    query: 'site:jobs.ashbyhq.com "Analyst" OR "Analytics"'
    enabled: true

  - name: Lever — Strategy & Ops
    query: 'site:jobs.lever.co {{roles_default}}'
    enabled: true

# ─── Tracked companies ───────────────────────────────────────────────────────
# Companies whose careers pages get checked directly. Each entry has
# either an `api:` URL (direct ATS scan, zero Claude tokens) OR
# `scan_method: websearch` + `scan_query` (fallback for proprietary
# portals). The desktop app auto-detects this when you Add Company —
# it probes the common ATS endpoints and writes the right config.
#
# A few examples below. Add your target companies here, or use the
# Configuration → Portals tab in the app to add them with API probing.

tracked_companies:

  # Example: a Greenhouse company
  - name: Adyen
    careers_url: https://job-boards.greenhouse.io/adyen
    api: https://boards-api.greenhouse.io/v1/boards/adyen/jobs
    notes: "Amsterdam / NYC / SF. Payments. Greenhouse ATS."
    enabled: true

  # Example: a Lever company
  - name: Notion
    careers_url: https://www.notion.so/careers
    api: https://api.lever.co/v0/postings/notion?mode=json
    notes: "SF / NYC. Productivity SaaS. Lever ATS."
    enabled: true

  # Example: an Ashby company
  - name: Linear
    careers_url: https://linear.app/careers
    api: https://api.ashbyhq.com/posting-api/job-board/linear?includeCompensation=true
    notes: "Remote-first. Project management. Ashby ATS."
    enabled: true

  # Example: a SmartRecruiters company
  - name: Wise
    careers_url: https://jobs.smartrecruiters.com/Wise
    api: https://api.smartrecruiters.com/v1/companies/Wise/postings
    notes: "London / Amsterdam / Tallinn. International payments."
    enabled: true

  # Example: a websearch fallback (no public API)
  - name: Stripe
    careers_url: https://stripe.com/jobs
    scan_method: websearch
    scan_query: 'site:stripe.com/jobs {{roles_default}} OR "Solutions"'
    notes: "Proprietary portal — no public API. Websearch fallback."
    enabled: true
