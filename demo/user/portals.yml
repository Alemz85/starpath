# Demo portals — fictional. Every tracked company below is a placeholder
# name; careers pages live on example.com and the ATS slugs end in "-demo"
# so a scan of this file finds nothing real. Generated by
# scripts/demo/build-demo.mjs.

search_templates:
  roles_default: '"Analyst" OR "Pricing" OR "Strategy" OR "Operations" OR "Graduate"'
  roles_analytics: '"Business Analyst" OR "Data Analyst" OR "Pricing Analyst" OR "Analytics"'
  loc_targets: 'Lyon OR Vienna OR Munich OR Prague OR Brussels OR Porto'

title_filter:
  positive:
    - "Pricing"
    - "Revenue"
    - "Analyst"
    - "Business Analyst"
    - "Data Analyst"
    - "Analytics"
    - "Insights"
    - "Strategy"
    - "Operations"
    - "Planning"
    - "Graduate"
    - "Graduate Programme"
    - "Rotational"
    - "Trainee"
    - "Associate"
    - "Junior"
  negative:
    - "Senior"
    - "Sr."
    - "Principal"
    - "Staff"
    - "Lead"
    - "Head of"
    - "Director"
    - "VP"
    - "Software Engineer"
    - "Data Engineer"
    - "Audit"
    - "Tax"
    - "Payroll"
    - "Clinical"
    - "Graphic Designer"
  seniority_boost:
    - "Junior"
    - "Graduate"
    - "Associate"
    - "Analyst"
    - "Trainee"

lang_blocklist:
  - "Deutschkenntnisse"
  - "(m/w/d)"

location_allowlist:
  - "remote"
  - "Lyon"
  - "Vienna"
  - "Munich"
  - "Prague"
  - "Brussels"
  - "Porto"

search_queries:
  - name: Greenhouse — analyst roles
    query: 'site:boards.greenhouse.io {{roles_analytics}} {{loc_targets}}'
    enabled: true
  - name: Lever — pricing and strategy
    query: 'site:jobs.lever.co {{roles_default}} {{loc_targets}}'
    enabled: true

