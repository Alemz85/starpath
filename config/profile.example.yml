# Career-Ops Profile Configuration
# Copy this file to config/profile.yml and fill in your details.
# This is the single source of truth for your personal data across all modes.

# Default evaluation mode for pasted JDs / URLs / auto-pipeline.
#   scouting     — lightweight landscape mapping (eligibility gate + Match + Ease, no PDF per listing).
#                  Use when you're mapping the market, not actively applying.
#   applying     — full A-H oferta evaluation with tailored PDF, ready to submit.
#                  Use when you're in active application mode.
# You can always override per-invocation with /career-ops scouting or /career-ops oferta.
current_mode: scouting

candidate:
  full_name: "Jane Smith"
  email: "jane@example.com"
  phone: "+1-555-0123"
  location: "San Francisco, CA"
  linkedin: "linkedin.com/in/janesmith"
  portfolio_url: "https://janesmith.dev"
  github: "github.com/janesmith"
  twitter: "https://x.com/janesmith"
  # (Optional) Canva resume design ID for visual CV generation via /career-ops pdf.
  # Find it in your Canva design URL: https://www.canva.com/design/DAxxxxxxx/...
  # The ID starts with "D" and is 11 characters long.
  # canva_resume_design_id: "DAxxxxxxxxx"

target_roles:
  # Your North Star roles — what you're optimizing for
  primary:
    - "Senior AI Engineer"
    - "Staff ML Engineer"
  # Archetypes help the evaluation system score fit
  archetypes:
    - name: "AI/ML Engineer"
      level: "Senior/Staff"
      fit: "primary"        # primary = dream role, secondary = good fit, adjacent = stretch
    - name: "AI Product Manager"
      level: "Senior"
      fit: "secondary"
    - name: "Solutions Architect"
      level: "Mid-Senior"
      fit: "adjacent"

narrative:
  # Your professional headline (1 line)
  headline: "ML Engineer turned AI product builder"
  # Your exit story — what makes you unique
  exit_story: "Built and sold my SaaS after 5 years. Now focused on applied AI at scale."
  # Your top 3-5 superpowers
  superpowers:
    - "End-to-end ML pipelines"
    - "Fast prototyping (idea to prod in 2 weeks)"
    - "Cross-functional communication"
  # Proof points — projects, articles, case studies with measurable impact
  proof_points:
    - name: "Project Alpha"
      url: "https://janesmith.dev/project-alpha"
      hero_metric: "Reduced inference latency 40%"
    - name: "Open Source Tool"
      url: "https://github.com/janesmith/tool"
      hero_metric: "2K+ GitHub stars"
  # Optional: dashboard/demo URL with credentials
  # dashboard:
  #   url: "https://janesmith.dev/demo"
  #   password: "demo-2026"

compensation:
  target_range: "$150K-200K"     # Your target total comp
  currency: "USD"
  minimum: "$120K"               # Walk-away number
  location_flexibility: "Remote preferred, 1 week/month on-site possible"

location:
  country: "United States"
  city: "San Francisco"
  timezone: "PST"
  visa_status: "No sponsorship needed"
  # For remote roles outside your country:
  # onsite_availability: "1 week/month in any city"

# ── Eligibility gate (scoring v2 — docs/scoring-v2.md § 1) ──────────────────
# Checked against every listing BEFORE it is scored. A listing that fails a
# check is "Blocked" (logged with its reason, no score); an unclear one is
# "amber" (scored, with a question to ask the recruiter). All values below are
# fictional placeholders — replace them with your own.
# eligibility:
#   available_from: "2027-01-15"            # earliest date you can start anything
#   blocked_windows:                         # no role may START or RUN inside these
#     - { from: "2027-09-01", to: "2027-12-20", reason: "final study term" }
#   graduations:                             # your own graduation dates (YYYY-MM)
#     - { degree: "BSc", date: "2025-06" }
#     - { degree: "MSc", date: "2027-06" }
#   languages:                               # CEFR level (A1..C2) or "native"
#     - { language: "English", level: "native" }
#     - { language: "Spanish", level: "B2" }
#   work_authorisation: ["US"]               # ISO codes; "EU" = EU-27 + EEA
#   duration_months:                         # acceptable length; one range ({ min: 3, max: 12 })
#     default: { min: 3, max: 12 }           # or one per type: internship, graduate_programme,
#     graduate_programme: { min: 12, max: 24 }   # fixed_term, working_student (rest → default)
#   permanent_start_ok_before_block: false   # false = a permanent role that would run
#                                            # through a blocked window is Blocked
#   score_through_red:                       # Blocked listings that still get Match / Ease,
#     checks: [start_date, work_auth]        # so the Database maps the market behind walls
#     languages: [German]                    # you may clear later (a language red: only these)
#     except_employment: [working_student]   # never scored

# ── Scoring weights (optional — omit to use the defaults) ───────────────────
# Match averages four motivators; Ease is a weighted geometric mean of three
# dimensions. Weights are relative. Defaults shown.
# scoring:
#   match_weights: { growth_mobility: 1, optionality_exit: 1, brand_value: 1, role_content: 1 }
#   ease_weights: { skills_match: 0.35, experience_bar: 0.35, competition: 0.30 }

# ── Calibration (optional — applied by scripts/score-listing.mjs) ───────────
# calibration:
#   dream_companies: ["Example Corp"]           # Match floor 8.0 (Brand untouched)
#   lower_tier_dream_companies: ["Sample Inc"]  # +0.25 Match (preference)
#   brand_affinity_companies: ["Demo Labs"]     # triage/brief boost only (e.g. CEMS partners)
#   extra_brand_bonuses:                        # Brand perception corrections only
#     - { company: "Placeholder Co", bonus: 0.5, reason: "household name in the target market" }
#   has_structured_onboarding: false            # true → +1 Growth

# ── Inbox triage (optional — read by scripts/triage-pipeline.mjs) ───────────
# Which pending postings get a deep evaluation. `brand: low` on a portals.yml
# tracked company applies the lowBrand weight; one company fills at most
# per_company_cap deep-eval slots per run (dream companies exempt). Defaults shown.
# triage:
#   weights: { lowBrand: -3 }   # any key of DEFAULT_WEIGHTS in scripts/lib/triage-core.mjs
#   per_company_cap: 5          # 0 = no cap

# ── Outcomes (optional — read by scripts/outcomes.mjs) ──────────────────────
# outcomes:
#   no_response_days: 30          # still Applied this long after sending → "no response"
#   materials_index: materials/index.tsv         # header-named TSV of what you sent
#                                 # (company, role, app_num, sent, materials, notes),
#                                 # relative to your data root (private/)

# ── Scanner liveness (optional — omit to use the defaults) ──────────────────
# `node scripts/check-liveness.mjs --record` writes what it finds into
# data/scan-history.tsv. A posting it can PROVE is gone is marked `expired`
# right away. A posting it merely could not REACH (network error, timeout, 5xx)
# is not evidence it is gone: each failed check is counted, and it is only marked
# `expired` (expired_reason: unreachable) once BOTH limits below are met. Any
# later successful check revives it.
#   weekly scans (the scheduler's cadence) — the defaults:  2 attempts over >= 240 h (10 days)
#   daily scans:                                            3 attempts over >=  48 h
# scanner:
#   liveness:
#     unreachable_attempts: 2     # failed checks in a row before it can expire
#     unreachable_hours: 240      # ...and at least this long since the first failure

# ── Portal review (optional — omit to use the defaults) ─────────────────────
# After the weekly scan, `node scripts/portal-review.mjs` suggests (as Messages
# in the app; it never edits user/portals.yml) which tracked companies to keep,
# pause or add. A company enters "probation" with a `# probation since
# YYYY-MM-DD` comment above its entry in user/portals.yml.
#   pause  no posting passed your title + location filters over `pause_min_scans`
#          scans spanning `pause_min_days` days, or its board keeps failing.
#          Graduate and intern programmes cluster Sep–Nov and Feb–Mar, so the
#          defaults (about five months) only fire after a whole season. Dream,
#          lower-tier-dream and brand-affinity companies are never suggested.
#   keep   a probation company produced a passing posting or a go/stretch/solid score.
#   add    an untracked company keeps turning up in the board-wide queries or
#          aggregators, or scored go/stretch/solid.
#   scanner:
#     portal_review:
#       enabled: true
#       pause_min_scans: 12         # scans with no passing posting…
#       pause_min_days: 150         # …spanning at least this many days
#       failing_scans: 3            # board URL failed this many scans in a row
#       add_min_postings: 2         # untracked company: distinct postings…
#       add_min_scans: 2            # …seen on at least this many scan days
#       max_per_run: 8              # new suggestions posted per run (the rest wait)
